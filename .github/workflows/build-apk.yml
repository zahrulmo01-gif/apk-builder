name: Build APK Direct From Repo

on:
  push:
    paths:
      - 'project.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          mkdir -p workspace
          unzip -o project.zip -d workspace

      - name: Compile Debug APK
        run: |
          cd workspace
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          mkdir -p $GITHUB_WORKSPACE/output
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          cp "$APK_FILE" $GITHUB_WORKSPACE/output/app-debug.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build APK
          files: output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
