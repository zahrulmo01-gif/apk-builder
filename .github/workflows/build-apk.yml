name: Build APK Direct From Repo

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'project.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract project.zip
        run: |
          echo "Mengekstrak project.zip..."
          mkdir -p workspace
          unzip -o project.zip -d workspace

      - name: Compile APK with Gradle
        run: |
          cd workspace
          
          # Cari folder yang berisi file Gradle
          BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$BUILD_DIR" ]; then
            echo "Masuk ke direktori build: $BUILD_DIR"
            cd "$BUILD_DIR"
          fi

          echo "Struktur isi folder:"
          ls -la

          # Generate wrapper jika belum ada
          if [ ! -f "gradlew" ]; then
            echo "gradlew tidak ditemukan, membuat wrapper otomatis..."
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

          # Siapkan folder output
          mkdir -p $GITHUB_WORKSPACE/output
          APK_PATH=$(find . -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Error: File APK gagal terbentuk!"
            exit 1
          fi

          echo "APK ditemukan di: $APK_PATH"
          cp "$APK_PATH" $GITHUB_WORKSPACE/output/app-debug.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build APK
          files: output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
