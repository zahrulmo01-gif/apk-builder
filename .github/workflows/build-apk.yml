name: Build APK Direct From Repo

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'project.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract project.zip
        run: |
          mkdir -p workspace
          unzip -o project.zip -d workspace

      - name: Compile APK
        run: |
          # 1. Cari letak file settings.gradle atau build.gradle di seluruh subfolder
          PROJECT_ROOT=$(find workspace -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Error: Tidak ditemukan file gradle di dalam project.zip!"
            ls -R workspace
            exit 1
          fi

          echo "Direktori proyek ditemukan di: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # 2. Cek apakah gradlew sudah ada
          if [ ! -f "./gradlew" ]; then
            echo "gradlew tidak ditemukan, inisialisasi wrapper menggunakan Gradle bawaan..."
            gradle wrapper --gradle-version 8.4 || true
          fi

          # 3. Eksekusi build (pakai gradlew jika berhasil dibuat, atau langsung perintah gradle runner)
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Menjalankan build langsung lewat binary gradle runner..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

          # 4. Ambil output APK
          mkdir -p $GITHUB_WORKSPACE/output
          APK_PATH=$(find . -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Error: File APK tidak ditemukan setelah build!"
            exit 1
          fi

          echo "APK berhasil dibuat: $APK_PATH"
          cp "$APK_PATH" $GITHUB_WORKSPACE/output/app-debug.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build APK
          files: output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
