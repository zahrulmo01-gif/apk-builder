name: Build APK from ZIP

on:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Extract Project ZIP
        run: |
          echo "Mengunduh file dari: ${{ github.event.client_payload.zip_url }}"
          # Download dengan header browser agar tidak dicegat bot-blocker
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               -o project.zip "${{ github.event.client_payload.zip_url }}"
          
          # Cek apakah file benar-benar zip
          head -c 10 project.zip
          mkdir -p workspace
          unzip -o project.zip -d workspace

      - name: Compile Debug APK
        run: |
          cd workspace
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          mkdir -p $GITHUB_WORKSPACE/output
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          cp "$APK_FILE" $GITHUB_WORKSPACE/output/app-debug.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build APK
          files: output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
